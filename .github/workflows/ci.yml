name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    quality:
        name: Lint, typecheck, testes e build
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
                  cache: yarn

            - name: Instalar dependências
              run: yarn install --frozen-lockfile

            - name: Gate de qualidade (lint + typecheck + testes com cobertura + build)
              run: yarn ci

    e2e:
        name: Testes E2E (Playwright)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
                  cache: yarn

            - name: Instalar dependências
              run: yarn install --frozen-lockfile

            - name: Instalar navegador do Playwright
              run: yarn playwright install --with-deps chromium

            - name: Build de produção
              run: yarn build

            - name: Rodar E2E
              run: yarn e2e

            - name: Publicar relatório em caso de falha
              uses: actions/upload-artifact@v4
              if: failure()
              with:
                  name: playwright-report
                  path: playwright-report/
                  retention-days: 7
